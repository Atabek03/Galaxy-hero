<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kosmik Himoyachi Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 900px;
            background: radial-gradient(circle at 50% 30%, #111a36 0%, #04060a 100%);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(4, 6, 12, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            padding: 24px;
            text-align: center;
        }
        .overlay h1 {
            font-size: 32px;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
        }
        .overlay p {
            font-size: 15px;
            color: #9ab;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .hint-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: #00f0ff;
            margin-bottom: 25px;
        }
        .play-btn {
            padding: 15px 45px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #0066ff, #00e5ff);
            border: none;
            border-radius: 35px;
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.6);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .play-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="start-screen">
        <h1>KOSMIK GALAXY</h1>
        <div class="hint-badge">👆 Barmog‘ingizni ekranga qo‘yib suring — kema o‘zi o‘q uzadi!</div>
        <p>Meteoritlardan saqlaning va bonuslarni oling.</p>
        <button class="play-btn" id="start-btn">JANGNI BOSHLASH</button>
    </div>

    <div class="overlay" id="game-over-screen" style="display: none;">
        <h1 style="color: #ff3355; text-shadow: 0 0 20px rgba(255,50,80,0.8);">KEMA YO'Q QILINDI</h1>
        <p id="final-score" style="font-size: 20px; color: #fff; font-weight: bold; margin-bottom: 8px;">Ball: 0</p>
        <p id="high-score" style="color: #ffcc00; margin-bottom: 25px;">Rekord: 0</p>
        <button class="play-btn" id="restart-btn">QAYTA BOSHLASH</button>
    </div>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    function haptic(type = 'light') {
        if (tg && tg.HapticFeedback) {
            if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
            else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
            else tg.HapticFeedback.impactOccurred('light');
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio tizimi
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSfx(type) {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const t = audioCtx.currentTime;

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(150, t + 0.1);
                gain.gain.setValueAtTime(0.06, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
                osc.start(t);
                osc.stop(t + 0.1);
            } else if (type === 'boom') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(160, t);
                osc.frequency.linearRampToValueAtTime(40, t + 0.22);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.22);
                osc.start(t);
                osc.stop(t + 0.22);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, t);
                osc.frequency.exponentialRampToValueAtTime(1100, t + 0.18);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
                osc.start(t);
                osc.stop(t + 0.18);
            }
            osc.connect(gain);
            gain.connect(audioCtx.destination);
        } catch(e){}
    }

    // O'yinchi sozlamalari
    let player = {
        x: canvas.width / 2,
        y: canvas.height - 120,
        targetX: canvas.width / 2,
        targetY: canvas.height - 120,
        w: 42,
        h: 46,
        hp: 3,
        shield: false,
        spread: 0,
        rapid: 0
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];
    let score = 0;
    let highScore = localStorage.getItem('kosmik_highscore') || 0;
    let isRunning = false;
    let isTouching = false;
    let shootCooldown = 0;
    let spawnCounter = 0;

    let stars = Array.from({length: 50}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.8 + 0.6,
        v: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.7 + 0.3
    }));

    // SENSORLI BOSHQARUV (TOUCH & DRAG)
    function handleTouchMove(e) {
        if (!isRunning) return;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        const touchX = touch.clientX - rect.left;
        const touchY = touch.clientY - rect.top;

        // Barmoq kemaning ustini to'sib qo'ymasligi uchun kema barmoqdan biroz yuqoriroqda yuradi (-45px)
        player.targetX = Math.max(player.w / 2, Math.min(canvas.width - player.w / 2, touchX));
        player.targetY = Math.max(player.h / 2, Math.min(canvas.height - player.h / 2, touchY - 45));
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isTouching = true;
        handleTouchMove(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleTouchMove(e);
    }, { passive: false });

    canvas.addEventListener('touchend', () => { isTouching = false; });
    canvas.addEventListener('touchcancel', () => { isTouching = false; });

    // Kompyuter sichqonchasi uchun ham qo'llab-quvvatlash
    let isMouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        isTouching = true;
        handleTouchMove(e);
    });
    window.addEventListener('mousemove', (e) => {
        if (isMouseDown) handleTouchMove(e);
    });
    window.addEventListener('mouseup', () => {
        isMouseDown = false;
        isTouching = false;
    });

    function fireBullet() {
        const speed = 11;
        playSfx('laser');
        haptic('light');

        if (player.spread > 0) {
            bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -speed, color: '#00f0ff' });
            bullets.push({ x: player.x - 10, y: player.y - 15, vx: -2.8, vy: -speed * 0.95, color: '#ffea00' });
            bullets.push({ x: player.x + 10, y: player.y - 15, vx: 2.8, vy: -speed * 0.95, color: '#ffea00' });
        } else {
            bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -speed, color: '#00f0ff' });
        }
    }

    function createExplosion(x, y, color, count = 16) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 5 + 1;
            particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                r: Math.random() * 3 + 1,
                life: 1,
                decay: Math.random() * 0.03 + 0.02,
                color
            });
        }
    }

    function spawnEnemy() {
        const type = Math.random() > 0.35 ? 'meteor' : 'drone';
        enemies.push({
            type,
            x: Math.random() * (canvas.width - 50) + 25,
            y: -35,
            hp: type === 'drone' ? 2 : 1,
            size: type === 'drone' ? 28 : (Math.random() * 15 + 20),
            speed: type === 'drone' ? 3 : (Math.random() * 2 + 2),
            angle: 0,
            rotSpeed: (Math.random() - 0.5) * 0.05
        });
    }

    function spawnPowerup(x, y) {
        if (Math.random() > 0.35) return;
        const kinds = ['spread', 'rapid', 'shield'];
        const kind = kinds[Math.floor(Math.random() * kinds.length)];
        powerups.push({ x, y, kind, vy: 2, size: 20 });
    }

    function update() {
        if (!isRunning) return;

        // Kema silliq barmoq koordinatasiga ergashadi (Smooth interpolation)
        player.x += (player.targetX - player.x) * 0.22;
        player.y += (player.targetY - player.y) * 0.22;

        // Barmoq tekkanda avtomatik otish (Auto-fire)
        if (shootCooldown > 0) shootCooldown--;
        if (isTouching && shootCooldown <= 0) {
            fireBullet();
            shootCooldown = player.rapid > 0 ? 8 : 14;
        }

        if (player.spread > 0) player.spread--;
        if (player.rapid > 0) player.rapid--;

        // O'qlar harakati
        bullets.forEach((b, i) => {
            b.x += b.vx;
            b.y += b.vy;
            if (b.y < -20 || b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
        });

        // Dushmanlar paydo bo'lishi
        spawnCounter++;
        if (spawnCounter > 30) {
            spawnEnemy();
            spawnCounter = 0;
        }

        // Dushmanlar harakati va to'qnashuv
        enemies.forEach((en, i) => {
            en.y += en.speed;
            en.angle += en.rotSpeed;

            const dist = Math.hypot(player.x - en.x, player.y - en.y);
            if (dist < player.w / 2 + en.size / 2) {
                createExplosion(en.x, en.y, '#ff4444', 20);
                enemies.splice(i, 1);
                haptic('impact');

                if (player.shield) {
                    player.shield = false;
                    playSfx('powerup');
                } else {
                    player.hp--;
                    playSfx('boom');
                    if (player.hp <= 0) gameOver();
                }
            }

            bullets.forEach((b, bi) => {
                const bDist = Math.hypot(b.x - en.x, b.y - en.y);
                if (bDist < en.size) {
                    en.hp--;
                    bullets.splice(bi, 1);
                    createExplosion(b.x, b.y, b.color, 6);

                    if (en.hp <= 0) {
                        createExplosion(en.x, en.y, en.type === 'drone' ? '#00e5ff' : '#ff7733', 18);
                        playSfx('boom');
                        spawnPowerup(en.x, en.y);
                        enemies.splice(i, 1);
                        score += en.type === 'drone' ? 25 : 10;
                    }
                }
            });

            if (en.y > canvas.height + 40) enemies.splice(i, 1);
        });

        // Bonuslar harakati
        powerups.forEach((p, pi) => {
            p.y += p.vy;
            const dist = Math.hypot(player.x - p.x, player.y - p.y);
            if (dist < player.w / 2 + p.size) {
                playSfx('powerup');
                haptic('light');
                if (p.kind === 'spread') player.spread = 450;
                if (p.kind === 'rapid') player.rapid = 400;
                if (p.kind === 'shield') player.shield = true;
                powerups.splice(pi, 1);
            }
            if (p.y > canvas.height + 30) powerups.splice(pi, 1);
        });

        // Zarrachalar
        particles.forEach((p, pi) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            if (p.life <= 0) particles.splice(pi, 1);
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Yulduzlar
        stars.forEach(st => {
            st.y += st.v;
            if (st.y > canvas.height) st.y = 0;
            ctx.fillStyle = `rgba(255, 255, 255, ${st.alpha})`;
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
            ctx.fill();
        });

        if (isRunning) {
            // O'qlar
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(b.x - 2.5, b.y, 5, 14);
            });
            ctx.shadowBlur = 0;

            // Bonuslar
            powerups.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.font = '22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const icon = p.kind === 'spread' ? '🔱' : (p.kind === 'rapid' ? '⚡' : '🛡️');
                ctx.fillText(icon, 0, 0);
                ctx.restore();
            });

            // Dushmanlar
            enemies.forEach(en => {
                ctx.save();
                ctx.translate(en.x, en.y);
                ctx.rotate(en.angle);

                if (en.type === 'drone') {
                    ctx.fillStyle = '#ff2255';
                    ctx.beginPath();
                    ctx.moveTo(0, en.size / 2);
                    ctx.lineTo(-en.size / 2, -en.size / 2);
                    ctx.lineTo(0, -en.size / 4);
                    ctx.lineTo(en.size / 2, -en.size / 2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#a66a4e';
                    ctx.beginPath();
                    ctx.arc(0, 0, en.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#693e2b';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Kema va reaktiv turbina
            ctx.save();
            ctx.translate(player.x, player.y);

            ctx.fillStyle = Math.random() > 0.5 ? '#ff9900' : '#ff3300';
            ctx.beginPath();
            ctx.moveTo(-6, player.h / 2);
            ctx.lineTo(0, player.h / 2 + Math.random() * 14 + 10);
            ctx.lineTo(6, player.h / 2);
            ctx.closePath();
            ctx.fill();

            // Neon kema tanasi
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.moveTo(0, -player.h / 2);
            ctx.lineTo(-player.w / 2, player.h / 2);
            ctx.lineTo(0, player.h / 3);
            ctx.lineTo(player.w / 2, player.h / 2);
            ctx.closePath();
            ctx.fill();

            if (player.shield) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(0, 0, player.w * 0.75, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            ctx.restore();

            // Portlash zarralari
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Yuqori panel: Ball va Jonlar
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px monospace';
            ctx.fillText(`BALL: ${score}`, 20, 36);

            let hpIcons = '';
            for (let i = 0; i < player.hp; i++) hpIcons += '❤️ ';
            ctx.font = '16px Arial';
            ctx.fillText(hpIcons, canvas.width - 90, 36);
        }

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        player.x = canvas.width / 2;
        player.y = canvas.height - 120;
        player.targetX = player.x;
        player.targetY = player.y;
        player.hp = 3;
        player.shield = false;
        player.spread = 0;
        player.rapid = 0;
        bullets = [];
        enemies = [];
        powerups = [];
        particles = [];
        score = 0;
        isRunning = true;
    }

    function gameOver() {
        isRunning = false;
        isTouching = false;
        haptic('error');
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('kosmik_highscore', highScore);
        }
        document.getElementById('final-score').innerText = `To'plangan ball: ${score}`;
        document.getElementById('high-score').innerText = `Eng yuqori rekord: ${highScore}`;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;

    draw();
</script>
</body>
</html>
